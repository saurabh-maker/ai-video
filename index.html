<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shorts Maker</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa1b1; --accent:#ffd84d; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  input, textarea, select { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0f1115; color:var(--text); font-size:15px; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:#0f1115; color:var(--text); cursor:pointer; font-size:14px; }
  .seg button.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  .go { width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#111; font-size:16px; font-weight:700; cursor:pointer; }
  .go:disabled { opacity:.5; cursor:not-allowed; }
  .small { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .small a, .status a { color:var(--accent); }
  details summary { cursor:pointer; font-size:14px; color:var(--muted); }
  .status { font-size:14px; line-height:1.6; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent); margin-right:8px; animation:pulse 1.2s infinite; }
  .dot.ok { background:var(--ok); animation:none; } .dot.bad { background:var(--bad); animation:none; }
  @keyframes pulse { 50% { opacity:.3; } }
  .btn2 { display:inline-block; margin-top:10px; padding:10px 14px; border-radius:10px; background:var(--accent); color:#111 !important; text-decoration:none; font-weight:600; }
  .hidden { display:none; }
  @media (max-width:480px){ .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Shorts Maker</h1>
  <p class="sub">Type a topic, pick options, and GitHub makes a 9:16 video for you.</p>

  <div class="card">
    <details id="setupBox">
      <summary>⚙️ Setup (one time): GitHub token &amp; repo</summary>
      <label>GitHub token (fine-grained, Actions: Read and write on this repo only)</label>
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
      <label>Repo owner</label>
      <input id="owner" placeholder="your-github-username">
      <label>Repo name</label>
      <input id="repo" placeholder="ai-video">
      <label>Branch</label>
      <input id="branch" value="main">
      <p class="small">Saved only in this browser (localStorage), never in the page code.
        Create one at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained tokens</a>.</p>
    </details>
  </div>

  <div class="card">
    <label>Video topic</label>
    <textarea id="topic" placeholder="e.g. Jo bachhe roz school jaate hain, woh bade hokar kya bante hain"></textarea>

    <div class="row">
      <div>
        <label>Language</label>
        <div class="seg" data-name="lang"><button data-v="hi" class="on">Hindi</button><button data-v="en">English</button></div>
      </div>
      <div>
        <label>Voice</label>
        <div class="seg" data-name="voice"><button data-v="f" class="on">Female</button><button data-v="m">Male</button></div>
      </div>
      <div>
        <label>Style</label>
        <div class="seg" data-name="style"><button data-v="real" class="on">Real</button><button data-v="cartoon">Cartoon</button></div>
      </div>
    </div>

    <button class="go" id="go">🎬 Make video</button>
  </div>

  <div class="card hidden" id="statusCard">
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const WORKFLOW = "make-video.yml";
const $ = id => document.getElementById(id);
const choice = { lang: "hi", voice: "f", style: "real" };

// ---- save / load settings in this browser only ----
function store(k, v) { try { localStorage.setItem("aisv_" + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem("aisv_" + k); } catch (e) { return null; } }
["token", "owner", "repo", "branch"].forEach(k => {
  const v = load(k); if (v) $(k).value = v;
  $(k).addEventListener("change", () => store(k, $(k).value.trim()));
});
// guess owner/repo from a GitHub Pages address like username.github.io/ai-video
(function guessRepo() {
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    if (!$("owner").value) $("owner").value = host.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (!$("repo").value && seg && !seg.endsWith(".html")) $("repo").value = seg;
  }
  if (!$("token").value) $("setupBox").open = true;
})();

// ---- option buttons ----
document.querySelectorAll(".seg").forEach(seg => {
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); choice[seg.dataset.name] = b.dataset.v;
  });
});

// ---- GitHub API ----
function cfg() {
  return { token: $("token").value.trim(), owner: $("owner").value.trim(),
           repo: $("repo").value.trim(), branch: $("branch").value.trim() || "main" };
}
async function gh(path, opts = {}) {
  const c = cfg();
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`, {
    ...opts,
    headers: { "Authorization": `Bearer ${c.token}`, "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
  });
  if (!r.ok && r.status !== 204) {
    let msg = ""; try { msg = (await r.json()).message; } catch (e) {}
    throw new Error(`GitHub said ${r.status}: ${msg || r.statusText}`);
  }
  return r.status === 204 ? null : r.json();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function show(html, kind = "") {
  $("statusCard").classList.remove("hidden");
  $("status").innerHTML = `<span class="dot ${kind}"></span>${html}`;
}

$("go").addEventListener("click", async () => {
  const c = cfg(), topic = $("topic").value.trim();
  if (!c.token || !c.owner || !c.repo) { $("setupBox").open = true; show("Fill in the setup first (token, owner, repo).", "bad"); return; }
  if (!topic) { show("Type a video topic first.", "bad"); return; }
  ["token", "owner", "repo", "branch"].forEach(k => store(k, c[k]));
  $("go").disabled = true;
  const started = Date.now() - 15000;
  try {
    show("Starting the video job on GitHub…");
    await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: c.branch, inputs: { topic, lang: choice.lang, voice: choice.voice, style: choice.style } })
    });

    // find the run we just started
    let run = null;
    for (let i = 0; i < 20 && !run; i++) {
      await sleep(3000);
      const d = await gh(`/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=5`);
      run = (d.workflow_runs || []).find(x => new Date(x.created_at).getTime() >= started);
    }
    if (!run) throw new Error("Job started but could not find it. Check the Actions tab on GitHub.");

    // wait until it finishes
    const t0 = Date.now();
    while (true) {
      run = await gh(`/actions/runs/${run.id}`);
      const mins = Math.floor((Date.now() - t0) / 60000), secs = Math.floor((Date.now() - t0) / 1000) % 60;
      if (run.status === "completed") break;
      show(`Making your video… <b>${run.status}</b> (${mins}m ${secs}s). Usually 5–10 minutes. Keep this tab open.<br>
            <a href="${run.html_url}" target="_blank" rel="noopener">Watch live log on GitHub</a>`);
      await sleep(10000);
    }

    if (run.conclusion === "success") {
      const a = await gh(`/actions/runs/${run.id}/artifacts`);
      const art = (a.artifacts || [])[0];
      show(`✅ Video ready!<br>
            Open the run page and click <b>video</b> under "Artifacts" to download (zip with final.mp4).<br>
            <a class="btn2" href="${run.html_url}#artifacts" target="_blank" rel="noopener">Download video</a>
            ${art ? `<div class="small">Size: ${(art.size_in_bytes / 1048576).toFixed(1)} MB · kept for 7 days</div>` : ""}`, "ok");
    } else {
      show(`❌ Job ended: <b>${run.conclusion}</b>.<br>
            <a href="${run.html_url}" target="_blank" rel="noopener">Open the log</a>, copy the red error and paste it to Claude.`, "bad");
    }
  } catch (e) {
    show(`❌ ${e.message}<br><span class="small">401 = wrong token · 403 = token needs Actions: Read and write · 404 = wrong owner/repo or workflow file missing · 422 = branch name wrong</span>`, "bad");
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
