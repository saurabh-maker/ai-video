name: Make video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave empty = auto topic)"
        required: false
        default: ""
        type: string
      lang:
        description: "Language"
        required: true
        default: "hi"
        type: choice
        options: ["hi", "en"]
      voice:
        description: "Voice (f = female, m = male)"
        required: true
        default: "f"
        type: choice
        options: ["f", "m"]
      style:
        description: "Picture style (real = realistic humans, cartoon)"
        required: true
        default: "real"
        type: choice
        options: ["real", "cartoon"]
      youtube:
        description: "Upload to YouTube Shorts?"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      yt_privacy:
        description: "YouTube privacy"
        required: true
        default: "private"
        type: choice
        options: ["private", "unlisted", "public"]
  schedule:   # 5 auto videos a day (India time). GitHub cron is UTC; may start a few minutes late.
    - cron: "37 2 * * *"    #  8:07 AM IST -> Hindi
    - cron: "37 6 * * *"    # 12:07 PM IST -> English
    - cron: "37 10 * * *"   #  4:07 PM IST -> Hindi
    - cron: "15 13 * * *"   #  6:45 PM IST -> English (test time)
    - cron: "7 16 * * *"    #  9:37 PM IST -> Hindi

permissions:
  contents: write   # lets the job publish the finished video as a GitHub Release (your site plays it from there)

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python packages
        run: pip install edge-tts requests pillow numpy

      - name: Make the video
        env:
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          VIDEO_LANG: ${{ inputs.lang || ((github.event.schedule == '37 6 * * *' || github.event.schedule == '15 13 * * *') && 'en' || 'hi') }}
          VOICE_GENDER: ${{ inputs.voice || vars.DAILY_VOICE || 'f' }}
          IMAGE_STYLE: ${{ inputs.style || vars.DAILY_STYLE || 'cartoon' }}
          AUTO_NICHE: ${{ vars.AUTO_NICHE }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Kidzivora' }}
          YT_UPLOAD: ${{ inputs.youtube || 'yes' }}
          YT_PRIVACY: ${{ inputs.yt_privacy || vars.DAILY_PRIVACY || 'public' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python pipeline.py

      - name: Publish video to your site (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_id }}" out/final.mp4 \
            --title "$(cat out/title.txt)" \
            --notes-file out/release_notes.txt

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/final.mp4
            out/script.json
            out/music_credit.txt
          if-no-files-found: warn
          retention-days: 7
